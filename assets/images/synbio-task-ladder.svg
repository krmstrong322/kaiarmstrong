<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 330" font-family="Helvetica, Arial, sans-serif">
  <rect width="1180" height="330" fill="#ffffff"/>
  <text x="590" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">The task ladder, easiest to hardest</text>

  <g font-size="15" fill="#111">
    <rect x="30" y="200" width="250" height="90" rx="10" fill="#eef4ff" stroke="#33507e" stroke-width="2"/>
    <text x="155" y="234" text-anchor="middle" font-weight="bold">1 · 4-helix square</text>
    <text x="155" y="260" text-anchor="middle" font-size="13">basic API use, routing, stapling</text>

    <rect x="320" y="160" width="250" height="90" rx="10" fill="#eef4ff" stroke="#33507e" stroke-width="2"/>
    <text x="445" y="194" text-anchor="middle" font-weight="bold">2 · Flat sheet 8 × 96</text>
    <text x="445" y="220" text-anchor="middle" font-size="13">2D sheet, crossovers, twist</text>

    <rect x="610" y="120" width="250" height="90" rx="10" fill="#eef4ff" stroke="#33507e" stroke-width="2"/>
    <text x="735" y="154" text-anchor="middle" font-weight="bold">3 · Honeycomb bundles</text>
    <text x="735" y="180" text-anchor="middle" font-size="13">6 and 12 helices, closed ring, 3D</text>

    <rect x="900" y="80" width="250" height="90" rx="10" fill="#fff3e6" stroke="#8a5a1d" stroke-width="2"/>
    <text x="1025" y="114" text-anchor="middle" font-weight="bold">4 · Shapes + wireframe</text>
    <text x="1025" y="140" text-anchor="middle" font-size="13">stars, disks, Rothemund classics,</text>
    <text x="1025" y="158" text-anchor="middle" font-size="13">tetrahedron — up to ~7,000 nt</text>
  </g>

  <line x1="60" y1="300" x2="1120" y2="70" stroke="#bbb" stroke-width="2" stroke-dasharray="6,5"/>
</svg>
